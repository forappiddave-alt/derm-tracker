name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to RU server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            git config --global --add safe.directory /opt/derm-tracker
            sudo git -C /opt/derm-tracker pull origin main
            cd /opt/derm-tracker
            sudo docker compose up -d --build
            sudo docker image prune -f
